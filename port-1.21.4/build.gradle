plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0'
group = 'com.creamclient'

base {
    archivesName = 'CreamClient-1.21.4'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.4'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
        }
        client {}
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.4-54.1.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'creamclient',
            'Specification-Vendor': 'sharagin',
            'Specification-Version': '1.0',
            'Implementation-Title': 'CreamClient',
            'Implementation-Version': '1.0',
            'Implementation-Vendor': 'sharagin'
        ])
    }
}
